# Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Cold start with no account: mint a guest, then the tutorial or the current episode.
# www, not the apex — breeq.space 308s to www and the WebView drops the install
# header on that redirect.
# Override for a local server:
#   ./gradlew installDebug -Pbreeq.startUrl=http://10.0.2.2:3333/auth/enter?launch=1
breeq.startUrl=https://www.breeq.space/auth/enter?launch=1
# Hosts the WebView is allowed to navigate inside (comma-separated). Anything else
# opens in the system browser or the matching app (X, WhatsApp, Telegram...).
breeq.appHosts=breeq.space,www.breeq.space,breeq-mu.vercel.app
